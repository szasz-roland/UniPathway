<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<script>
(function(){
  try{
    var saved=localStorage.getItem("orarend-theme");
    var mode=saved||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    document.documentElement.setAttribute("data-theme",mode);
  }catch(e){}
})();
</script>
<title>Órarend</title>
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="logo" id="burger" title="Menü">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </div>
      <div id="rail"></div>
      <button class="checklist-btn" id="checklistBtn" title="Listák">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
      </button>
      <button class="gear" id="gearBtn" title="Beállítások">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </aside>

    <main class="main">
      <div class="head">
        <div class="title" id="pageTitle">Órarend<span class="day" id="dayName">Hétfő</span></div>
        <div class="date" id="dateBox"><div class="d" id="dCount">4</div><div class="m">óra ma</div></div>
      </div>
      <div id="schedviews">
        <div id="list"></div>
        <div class="week" id="week"></div>
      </div>
      <div id="codepage" hidden></div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <nav class="drawer" id="drawer" aria-hidden="true">
    <div class="dr-body" id="navbody"></div>
  </nav>

  <div class="sheet-scrim" id="sheetScrim"></div>
  <div class="sheet" id="courseSheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <button type="button" class="sheet-close" id="sheetClose" aria-label="Bezárás">&times;</button>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="js/script.js"></script>
</body>
</html>
