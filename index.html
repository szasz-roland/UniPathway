<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<script>
(function(){
  try{
    var saved=localStorage.getItem("orarend-theme");
    var mode=saved||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    document.documentElement.setAttribute("data-theme",mode);
  }catch(e){}
})();
</script>
<title>Órarend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#1d2233; --ink-2:#5a6178; --faint:#9aa0b4; --surface-2:#f5f6f9;
    --rail:#20242e; --rail-line:#333949; --rail-tx:#aeb4c7; --rail-tx-2:#8a90a6;
    --hair:#eef0f4;
    --ea-bg:#e8f3f4;   --ea-tx:#1f6b74;   --ea-ac:#2fa8b5;
    --gy-bg:#fdeee6;   --gy-tx:#a2542c;   --gy-ac:#e8834b;
    --pr-bg:#eeeafb;   --pr-tx:#5a3fa8;   --pr-ac:#8b6de0;
    --mt-bg:#e8f1ea;   --mt-tx:#356148;   --mt-ac:#5fa87c;
    --sel:#f4b63f;
    --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-in-out:cubic-bezier(.77,0,.175,1);
    --ease-drawer:cubic-bezier(.32,.72,0,1);
  }
  [data-theme="dark"]{
    --bg:#14161d; --ink:#eef0f4; --ink-2:#aeb4c7; --faint:#6c7288; --surface-2:#1c2029; --hair:#2a2f3b;
    --ea-bg:#183638; --ea-tx:#7fd2da; --ea-ac:#2fa8b5;
    --gy-bg:#3a2a1e; --gy-tx:#f0b184; --gy-ac:#e8834b;
    --pr-bg:#2a2440; --pr-tx:#c3b3f2; --pr-ac:#8b6de0;
    --mt-bg:#1e3226; --mt-tx:#9bd6b0; --mt-ac:#5fa87c;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  /* FIX 1: Strict height matching & no bounce scrolling */
  html, body {
    height: 100dvh; /* Dynamic viewport height (perfect for mobile) */
    height: 100vh;  /* Fallback for older engines */
    margin: 0;
    padding: 0;
    overscroll-behavior: none; /* Prevents the "rubber band" bounce effect */
  }

  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.4;
    -webkit-font-smoothing:antialiased; display: flex; flex-direction: column;
    transition:background 200ms ease,color 200ms ease;
  }

  /* FIX 2: Constrain shell to exact screen size */
  .shell{display:grid;grid-template-columns:76px 1fr;height:100%;width:100%;overflow:hidden}

  /* ---- left rail ---- */
  .rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:4px;
    position:sticky;top:0;height:100%}
  .rail .logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px;cursor:pointer;flex:0 0 auto;
    transition:background .15s,transform 140ms var(--ease-out)}
  .rail .logo svg{opacity:.9;transition:transform 300ms var(--ease-in-out)}
  .rail .logo:hover{background:var(--rail-line)}
  .rail .logo:active{transform:scale(.92)}
  .rail .logo.active{background:var(--rail-line)}
  .rail .logo.active svg{transform:rotate(90deg)}
  .dbtn{width:44px;height:44px;min-height:44px;max-height:44px;flex:0 0 44px;border:none;background:transparent;color:var(--rail-tx);font-family:var(--sans);
    font-weight:700;font-size:15px;border-radius:12px;cursor:pointer;position:relative;transition:background .15s,color .15s,transform 140ms var(--ease-out);
    display:grid;place-items:center;line-height:1;padding:0}
  .dbtn:hover{background:var(--rail-line);color:#fff}
  .dbtn:active{transform:scale(.93)}
  .dbtn.on{background:#fff;color:var(--rail)}
  .dbtn.on::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
    width:6px;height:6px;border-radius:50%;background:var(--sel)}
  .dbtn .cnt{position:absolute;top:6px;right:8px;font-size:9px;font-weight:800;color:var(--sel);line-height:1}
  .dbtn.on .cnt{color:var(--gy-ac)}
  .dbtn.free{opacity:.45}
  #rail{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;flex:0 0 auto;height:auto}
  #rail .dbtn{height:44px;flex:0 0 44px;align-self:center}
  .rail-label-wrap{width:28px;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .rail-label{white-space:nowrap;font-size:13px;font-weight:800;letter-spacing:.03em;color:var(--rail-tx);transform:rotate(-90deg)}
  .rail .gear,.rail .checklist-btn{width:40px;height:40px;border:none;background:transparent;color:var(--rail-tx-2);
    cursor:pointer;border-radius:11px;display:grid;place-items:center;transition:background .15s,color .15s,transform 140ms var(--ease-out)}
  .rail .checklist-btn{margin-top:auto}
  .rail .gear:hover,.rail .checklist-btn:hover{background:var(--rail-line);color:#fff}
  .rail .gear:active,.rail .checklist-btn:active{transform:scale(.9)}
  .rail .gear.active,.rail .checklist-btn.active{background:var(--rail-line);color:#fff}

  /* FIX 3: Make main area scroll independently, reduce padding to maximize space */
  .main{padding:28px clamp(16px,4vw,40px) 40px;min-width:0;overflow-y:auto;height:100%}

  .head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
  .head .title{font-size:32px;font-weight:800;letter-spacing:-.02em}
  .head .title .day{display:block;font-size:15px;font-weight:600;color:var(--ink-2);margin-top:2px}
  .head .date{text-align:right}
  .head .date .d{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.01em}
  .head .date .m{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:3px}

  .list{display:flex;flex-direction:column;gap:14px;max-width:640px}
  .item{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;animation:enterUp 260ms var(--ease-out) both}
  .item:nth-child(2){animation-delay:40ms}
  .item:nth-child(3){animation-delay:80ms}
  .item:nth-child(4){animation-delay:120ms}
  .item:nth-child(5){animation-delay:160ms}
  @keyframes enterUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .item .tcol{text-align:right;padding-top:14px}
  .item .tcol .s{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
  .item .tcol .e{font-size:12px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:2px}
  .list .item{cursor:pointer}
  .list .item:active .card{transform:scale(.98)}
  .card{border-radius:18px;padding:16px 18px;position:relative;cursor:default;overflow:hidden;transition:transform 140ms var(--ease-out);
    border:1px solid transparent}
  .card .arw{position:absolute;top:15px;right:16px;opacity:.5}
  .card .cn{font-size:17px;font-weight:700;letter-spacing:-.01em;padding-right:22px;line-height:1.2}
  .card .sub{font-size:13px;font-weight:600;opacity:.85;margin-top:3px}
  .card .foot{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;font-weight:600;opacity:.9}
  .card .foot svg{opacity:.7}
  .card.ea{background:var(--ea-bg);color:var(--ea-tx)}  .card.ea .arw{color:var(--ea-ac)}
  .card.gy{background:var(--gy-bg);color:var(--gy-tx)}  .card.gy .arw{color:var(--gy-ac)}
  .card.pr{background:var(--pr-bg);color:var(--pr-tx)}  .card.pr .arw{color:var(--pr-ac)}
  .card.mt{background:var(--mt-bg);color:var(--mt-tx)}  .card.mt .arw{color:var(--mt-ac)}
  .card.now{box-shadow:0 8px 24px -8px currentColor;animation:nowPulse 3200ms var(--ease-in-out) infinite}
  @keyframes nowPulse{0%,100%{box-shadow:0 8px 24px -8px currentColor}50%{box-shadow:0 12px 30px -6px currentColor}}
  .card .pin{font-weight:800}

  .freeday{max-width:560px;text-align:center;padding:60px 20px;color:var(--faint);animation:enterUp 260ms var(--ease-out) both}
  .freeday .big{font-size:26px;font-weight:800;color:var(--mt-tx)}
  .freeday .s{font-size:14px;margin-top:8px}

  .drchips{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
  .drchip{background:var(--surface-2);border-radius:11px;padding:10px 13px}
  .drchip b{display:block;font-weight:700;font-size:13px}
  .drchip span{color:var(--faint);font-size:11.5px}

  .codepage{max-width:640px;animation:enterUp 260ms var(--ease-out) both}

  /* ---- submenu panel (expands from the rail) ---- */
  .scrim{position:fixed;top:0;left:76px;right:0;bottom:0;background:rgba(20,24,36,.4);opacity:0;visibility:hidden;
    transition:opacity 250ms var(--ease-out),visibility 250ms;z-index:60}
  .scrim.show{opacity:1;visibility:visible}
  .drawer{position:fixed;top:0;left:76px;bottom:0;width:min(390px,calc(100vw - 76px));background:var(--rail);z-index:70;
    clip-path:inset(0 100% 0 0);transition:clip-path 380ms var(--ease-in-out);display:flex;flex-direction:column;
    pointer-events:none;box-shadow:2px 0 30px rgba(20,24,36,.18)}
  .drawer.show{clip-path:inset(0 0 0 0);pointer-events:auto}

  .sheet-scrim{position:fixed;inset:0;background:rgba(20,24,36,.4);opacity:0;visibility:hidden;
    transition:opacity 250ms var(--ease-out),visibility 250ms;z-index:80}
  .sheet-scrim.show{opacity:1;visibility:visible}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--bg);
    border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%);pointer-events:none;transition:transform 320ms var(--ease-drawer);
    box-shadow:0 -16px 40px -16px rgba(20,24,36,.35);z-index:90}
  .sheet.show{transform:translateY(0);pointer-events:auto}
  .sheet-handle{width:36px;height:4px;background:var(--hair);border-radius:99px;margin:6px auto 16px}
  .sheet-title{font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
  .sheet-sub{font-size:12.5px;color:var(--faint);font-weight:600;margin-top:3px;margin-bottom:16px}
  .sheet-action{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 13px;border-radius:13px;
    border:none;background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-weight:700;font-size:14px;
    cursor:pointer;margin-bottom:8px;transition:background 150ms ease,transform 140ms var(--ease-out)}
  .sheet-action:last-child{margin-bottom:0}
  .sheet-action:hover{background:var(--hair)}
  .sheet-action:active{transform:scale(.98)}
  .sheet-action svg{opacity:.7;flex:0 0 auto}
  .dr-body{overflow-y:auto;padding:20px 14px;flex:1;display:flex;flex-direction:column;gap:6px}

  .navlink{display:block;width:100%;text-align:left;border:none;background:transparent;color:var(--rail-tx);
    font-family:var(--sans);font-weight:700;font-size:14px;padding:13px 14px;border-radius:11px;cursor:pointer;
    transition:background 150ms ease,color 150ms ease,transform 140ms var(--ease-out)}
  .navlink:hover{background:var(--rail-line);color:#fff}
  .navlink.active{background:var(--rail-line);color:#fff}
  .navlink:active{transform:scale(.98)}

  .grp{font-size:11px;font-weight:700;color:var(--faint);margin:14px 4px 8px}
  .grp:first-child{margin-top:2px}
  .crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--hair);
    background:var(--surface-2);border-radius:11px;padding:11px 13px;margin-bottom:6px;cursor:pointer;
    font-family:var(--sans);color:var(--ink);transition:border-color 150ms ease,background-color 150ms ease,transform 140ms var(--ease-out)}
  .crow:hover{border-color:var(--ea-ac)}
  .crow:active{transform:scale(.98)}
  .crow.copied{border-color:var(--mt-ac);background:var(--mt-bg)}
  .crow .ck{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;min-width:128px;color:var(--ea-tx)}
  .crow.copied .ck{color:var(--mt-tx)}
  .crow .cnm{font-size:12px;color:var(--ink-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .cic{font-size:12px;color:var(--faint)}
  .roomsearch-input{width:100%;padding:13px 16px;border-radius:13px;border:1px solid var(--hair);background:var(--surface-2);
    color:var(--ink);font-family:var(--sans);font-size:14.5px}
  .roomsearch-input:focus{outline:2px solid var(--ea-ac);outline-offset:1px}
  .roomsearch-hint{color:var(--faint);font-size:12px;margin:10px 2px 16px}
  .roomsearch-empty{color:var(--faint);font-size:13.5px;padding:20px 4px}
  .room-list{display:flex;flex-direction:column;gap:10px}
  .room-card{cursor:default}
  .room-card .rc-code{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:800;letter-spacing:.02em;opacity:.8}
  .room-card .rc-name{font-size:15.5px;font-weight:700;margin-top:3px;letter-spacing:-.01em;padding-right:0}
  .room-card .rc-meta{display:flex;align-items:flex-start;gap:6px;margin-top:9px;font-size:12px;font-weight:600;opacity:.9;line-height:1.4}
  .room-card .rc-meta svg{opacity:.7;flex:0 0 auto;margin-top:1px}
  .room-card .rc-mapbtn{margin-top:12px;border:none;background:rgba(255,255,255,.5);color:inherit;font-family:var(--sans);
    font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:10px;cursor:pointer;
    transition:background 150ms ease,transform 140ms var(--ease-out)}
  .room-card .rc-mapbtn:hover{background:rgba(255,255,255,.8)}
  .room-card .rc-mapbtn:active{transform:scale(.96)}
  .room-map{margin-top:12px;border-radius:12px;overflow:hidden;animation:enterUp 220ms var(--ease-out) both}
  .room-map iframe{width:100%;height:220px;border:0;display:block}
  .copyall{width:100%;background:var(--rail);color:#fff;border:none;border-radius:12px;padding:14px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:background 150ms ease,transform 140ms var(--ease-out)}
  .copyall:active{background:var(--ea-tx);transform:scale(.98)}

  /* ---- week grid (wide desktop) ---- */
  .week{display:none}
  .weekgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:4px}
  .wcol{min-width:0;animation:enterUp 300ms var(--ease-out) both}
  .wcol:nth-child(2){animation-delay:40ms}
  .wcol:nth-child(3){animation-delay:80ms}
  .wcol:nth-child(4){animation-delay:120ms}
  .wcol:nth-child(5){animation-delay:160ms}
  .wcol .wh{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 12px;
    border-bottom:2px solid var(--hair);margin-bottom:12px}
  .wcol .wh .wn{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .wcol.today .wh .wn{color:var(--gy-ac)}
  .wcol.freecol .wh .wn{color:var(--faint)}
  .wcol .wh .wc{font-size:11px;font-weight:700;color:var(--faint)}
  .wcol .wcards{display:flex;flex-direction:column;gap:10px}
  .wcard{border-radius:14px;padding:11px 12px;position:relative;overflow:hidden}
  .wcard .wt{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;opacity:.85}
  .wcard .wnm{font-size:13.5px;font-weight:700;line-height:1.2;margin:3px 0 4px;letter-spacing:-.01em}
  .wcard .wr{font-size:11px;font-weight:600;opacity:.82;display:flex;gap:4px;align-items:flex-start}
  .wcard .wr svg{flex:0 0 auto;margin-top:1px;opacity:.7}
  .wcard.ea{background:var(--ea-bg);color:var(--ea-tx)}
  .wcard.gy{background:var(--gy-bg);color:var(--gy-tx)}
  .wcard.pr{background:var(--pr-bg);color:var(--pr-tx)}
  .wcard.mt{background:var(--mt-bg);color:var(--mt-tx)}
  .wcard.now{box-shadow:0 6px 18px -6px currentColor;animation:nowPulseSm 3200ms var(--ease-in-out) infinite}
  @keyframes nowPulseSm{0%,100%{box-shadow:0 6px 18px -6px currentColor}50%{box-shadow:0 9px 22px -5px currentColor}}
  .wempty{padding:26px 8px;text-align:center;color:var(--faint);font-size:12.5px;font-weight:600;
    border:1.5px dashed var(--hair);border-radius:14px}

  /* ---- settings panel ---- */
  .set-section{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .set-label{font-size:11px;font-weight:700;color:var(--rail-tx-2);text-transform:uppercase;letter-spacing:.04em;padding:0 2px}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:11px;background:var(--rail-line)}
  .set-row span{font-size:14px;font-weight:700;color:var(--rail-tx)}
  .switch{position:relative;width:42px;height:24px;flex:0 0 auto;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{position:absolute;inset:0;background:rgba(255,255,255,.15);border-radius:99px;transition:background 200ms ease}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
    transition:transform 220ms var(--ease-out)}
  .switch input:checked ~ .track{background:var(--sel)}
  .switch input:checked ~ .track::after{transform:translateX(18px)}
  .exportbtns{display:flex;gap:8px}
  .exportbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 8px;border-radius:12px;
    border:1px solid var(--rail-line);background:transparent;color:var(--rail-tx);cursor:pointer;font-family:var(--sans);
    font-weight:800;font-size:13px;transition:background 150ms ease,color 150ms ease,transform 140ms var(--ease-out)}
  .exportbtn:hover{background:var(--rail-line);color:#fff}
  .exportbtn:active{transform:scale(.96)}
  .exportbtn:disabled{opacity:.5;cursor:default}
  .export-err{font-size:12.5px;color:#ff8a80;font-weight:600;margin-top:10px;line-height:1.4}

  /* ---- checklist panel ---- */
  .cl-newbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;border:1px dashed var(--rail-line);
    background:transparent;color:var(--rail-tx);font-family:var(--sans);font-weight:700;font-size:13.5px;padding:12px 14px;border-radius:11px;
    cursor:pointer;transition:background 150ms ease,border-color 150ms ease,color 150ms ease,transform 140ms var(--ease-out)}
  .cl-newbtn:hover{background:var(--rail-line);border-color:var(--rail-tx-2);color:#fff}
  .cl-newbtn:active{transform:scale(.98)}
  .cl-form{display:flex;flex-direction:column;gap:8px;background:var(--rail-line);border-radius:12px;padding:12px;animation:enterUp 220ms var(--ease-out) both}
  .cl-catpick{display:flex;gap:6px}
  .cl-cat{flex:1;padding:9px 6px;border-radius:9px;border:1px solid transparent;background:rgba(255,255,255,.06);color:var(--rail-tx-2);
    font-family:var(--sans);font-weight:700;font-size:11.5px;cursor:pointer;text-align:center;transition:background 150ms ease,color 150ms ease}
  .cl-cat.active{background:#fff;color:var(--rail)}
  .cl-name-input{padding:10px 12px;border-radius:9px;border:none;background:rgba(255,255,255,.08);color:#fff;font-family:var(--sans);font-size:13px}
  .cl-name-input::placeholder{color:var(--rail-tx-2)}
  .cl-name-input:focus{outline:2px solid var(--sel)}
  .cl-confirm{background:var(--sel);color:var(--rail);border:none;border-radius:9px;padding:10px;font-weight:800;font-size:13px;cursor:pointer;transition:transform 140ms var(--ease-out)}
  .cl-confirm:active{transform:scale(.97)}
  .cl-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;
    color:var(--rail-tx);font-family:var(--sans);font-weight:700;font-size:13.5px;padding:9px 10px;border-radius:11px;cursor:pointer;
    transition:background 150ms ease,color 150ms ease,transform 140ms var(--ease-out)}
  .cl-row:hover{background:var(--rail-line);color:#fff}
  .cl-row.active{background:var(--rail-line);color:#fff}
  .cl-row:active{transform:scale(.98)}
  .cl-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
  .cl-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cl-del{border:none;background:transparent;color:var(--rail-tx-2);cursor:pointer;width:24px;height:24px;border-radius:7px;flex:0 0 auto;
    display:grid;place-items:center;font-size:11px;transition:background 150ms ease,color 150ms ease}
  .cl-del:hover{background:rgba(255,255,255,.14);color:#fff}

  /* ---- checklist item views (in main content) ---- */
  .additem{display:flex;gap:8px;margin-bottom:16px}
  .additem-input{flex:1;padding:11px 13px;border-radius:11px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:14px}
  .additem-input:focus{outline:2px solid var(--ea-ac);outline-offset:1px}

/* ---------- persistence ---------- */
const CHECKLIST_KEY="orarend-checklists-v1";
function loadChecklists(){try{return JSON.parse(localStorage.getItem(CHECKLIST_KEY))||[];}catch(e){return[];}}
function saveChecklists(){try{localStorage.setItem(CHECKLIST_KEY,JSON.stringify(checklists));}catch(e){}}
let checklists=loadChecklists();

function getChecklist(id){return checklists.find(l=>l.id===id);}
function createChecklist(category,name){
  const list={id:"cl_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    category,name,colorKey:COLOR_CYCLE[checklists.length%COLOR_CYCLE.length],items:[]};
  checklists.push(list);saveChecklists();return list;
}
function deleteChecklist(id){checklists=checklists.filter(l=>l.id!==id);saveChecklists();}
function addItem(listId,name){
  const list=getChecklist(listId);if(!list)return;
  const item={id:"it_"+Date.now()+"_"+Math.random().toString(36).slice(2,5),name};
  if(list.category==="shopping")item.price=0;else item.done=false;
  list.items.push(item);saveChecklists();
}
function removeItem(listId,itemId){
  const list=getChecklist(listId);if(!list)return;
  list.items=list.items.filter(i=>i.id!==itemId);saveChecklists();
}
function updateItemPrice(listId,itemId,price){
  const list=getChecklist(listId);const item=list&&list.items.find(i=>i.id===itemId);
  if(item){item.price=price;saveChecklists();}
}
function toggleItemDone(listId,itemId){
  const list=getChecklist(listId);const item=list&&list.items.find(i=>i.id===itemId);
  if(item){item.done=!item.done;saveChecklists();}
}
function calcSum(list){return list.items.reduce((s,i)=>s+(Number(i.price)||0),0);}

/* ---------- theme ---------- */
function getTheme(){return document.documentElement.getAttribute("data-theme")||"light";}
function applyTheme(mode){
  document.documentElement.setAttribute("data-theme",mode);
  const mc=document.querySelector('meta[name="theme-color"]');
  if(mc)mc.setAttribute("content",mode==="dark"?"#14161d":"#ffffff");
  try{localStorage.setItem("orarend-theme",mode);}catch(e){}
}

/* ---------- navigation ---------- */
function goto(newView,dayIndex){
  view=newView;
  if(typeof dayIndex==="number")curDay=dayIndex;
  rail();
  renderHead();
  renderMain();
}
function openChecklist(id){
  view="checklist";activeChecklistId=id;
  rail();renderHead();renderMain();
}

/* ---------- course action sheet ---------- */
function openCourseSheet(course){
  sheetCourse=course;
  const body=document.getElementById("sheetBody");body.innerHTML="";
  const title=E("div");title.className="sheet-title";title.textContent=course.name;
  const sub=E("div");sub.className="sheet-sub";sub.textContent=`${course.s}–${course.en} · ${course.room}`;
  body.appendChild(title);body.appendChild(sub);

  const roomBtn=E("button");roomBtn.type="button";roomBtn.className="sheet-action";
  roomBtn.innerHTML=svgLoc+"<span>Terem keresése</span>";
  roomBtn.onclick=()=>{
    closeCourseSheet();
    roomQuery=course.room;
    goto("teremkereso");
  };
  body.appendChild(roomBtn);

  document.getElementById("courseSheet").classList.add("show");
  document.getElementById("courseSheet").setAttribute("aria-hidden","false");
  document.getElementById("sheetScrim").classList.add("show");
}
function closeCourseSheet(){
  document.getElementById("courseSheet").classList.remove("show");
  document.getElementById("courseSheet").setAttribute("aria-hidden","true");
  document.getElementById("sheetScrim").classList.remove("show");
  sheetCourse=null;
}
document.getElementById("sheetScrim").onclick=closeCourseSheet;

function rail(){
  const r=document.getElementById("rail");r.innerHTML="";
  if(!isScheduleView(view)){
    const wrap=E("div");wrap.className="rail-label-wrap";
    const label=E("div");label.className="rail-label";
    label.textContent=view==="checklist"?((getChecklist(activeChecklistId)||{}).name||"Lista"):PAGE_LABELS[view];
    wrap.appendChild(label);r.appendChild(wrap);
    return;
  }
  const dataset=datasetFor(view);
  DAYS.forEach((d,i)=>{
    const n=dataset.filter(e=>e[0]===i).length;
    const b=E("button");b.className="dbtn"+(i===curDay?" on":"")+(n===0?" free":"");
    b.innerHTML=SHORT[i]+(n?`<span class="cnt">${n}</span>`:"");
    b.onclick=()=>goto(view,i);
    r.appendChild(b);
  });
}

function renderHead(){
  const t=document.getElementById("pageTitle");
  const d=document.getElementById("dateBox");
  if(isScheduleView(view)){
    t.innerHTML=`${PAGE_LABELS[view]}<span class="day" id="dayName">${DAYS[curDay]}</span>`;
    d.hidden=false;
  }else if(view==="checklist"){
    const list=getChecklist(activeChecklistId);
    t.textContent=list?list.name:"Lista";
    d.hidden=true;
  }else{
    t.textContent=PAGE_LABELS[view];
    d.hidden=true;
  }
}

function renderMain(){
  document.getElementById("schedviews").hidden=!isScheduleView(view);
  document.getElementById("codepage").hidden=isScheduleView(view);

  else if(view==="checklist"){renderChecklistItemsView();}
  else if(view==="teremkereso"){renderRoomSearch();}
  else{renderCodepage();}
}

function day(){
  const items=datasetFor(view).filter(e=>e[0]===curDay);
  document.getElementById("dCount").textContent=items.length||"0";
  const wrap=document.getElementById("list");wrap.innerHTML="";
  if(items.length===0){
    const f=E("div");f.className="freeday";f.innerHTML='<div class="big">Szabadnap</div><div class="s">Nincs egyetlen órád sem. Élvezd.</div>';
    wrap.appendChild(f);return;
  }
  const list=E("div");list.className="list";
  items.forEach(e=>{
    const[,s,en,name,room,who,type,pref]=e;
    const isNow=curDay===nowDay&&nowMin>=mins(s)&&nowMin<mins(en);
    const it=E("div");it.className="item";
    it.innerHTML=
      `<div class="tcol"><div class="s">${s}</div><div class="e">${en}</div></div>`+
      `<div class="card ${type}${isNow?' now':''}">`+
        `<span class="arw">${svgArw}</span>`+
        `<div class="cn">${name}${pref?' <span class="pin">★</span>':''}</div>`+
        `<div class="foot">${svgLoc}<span>${room}${who?' · '+who:''}</span></div>`+
      `</div>`;
    it.onclick=()=>openCourseSheet({name,room,who,s,en,type});
    list.appendChild(it);
  });
  wrap.appendChild(list);
}

function renderCodepage(){
  const el=document.getElementById("codepage");el.innerHTML="";
  const wrap=E("div");wrap.className="codepage";
  if(view==="online"){
    const oc=E("div");oc.className="drchips";
    ONLINE.forEach(([n,m])=>{const x=E("div");x.className="drchip";x.innerHTML=`<b>${n}</b><span>${m}</span>`;oc.appendChild(x);});
    wrap.appendChild(oc);
  }else{
    const[,rows]=CODES[view==="kotelezo"?0:1];
    rows.forEach(([k,n])=>{
      const r=E("button");r.className="crow";
      r.innerHTML=`<span class="ck">${k}</span><span class="cnm">${n}</span><span class="cic">⧉</span>`;
      r.onclick=()=>navigator.clipboard.writeText(k).then(()=>{
        r.classList.add("copied");r.querySelector(".cic").textContent="✓";
        setTimeout(()=>{r.classList.remove("copied");r.querySelector(".cic").textContent="⧉"},1200);
      });
      wrap.appendChild(r);
    });
    const foot=E("div");foot.style.marginTop="16px";
    const btn=E("button");btn.className="copyall";btn.textContent=`Mind a ${rows.length} kód másolása`;
    btn.onclick=()=>{
      const all=rows.map(r=>r[0]).join("\n");
      navigator.clipboard.writeText(all).then(()=>{
        const o=btn.textContent;btn.textContent=`✓ ${rows.length} kód másolva`;
        setTimeout(()=>btn.textContent=o,1500);
      });
    };
    foot.appendChild(btn);wrap.appendChild(foot);
  }
  el.appendChild(wrap);
}

function matchesRoom(r,q){
  q=q.toLowerCase();
  return r.code.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)||
    r.dept.toLowerCase().includes(q)||r.address.toLowerCase().includes(q)||
    (r.aliases||[]).some(a=>a.toLowerCase().includes(q));
}
function renderRoomSearch(){
  const el=document.getElementById("codepage");el.innerHTML="";
  const wrap=E("div");wrap.className="codepage";

  const input=E("input");input.type="text";input.className="roomsearch-input";
  input.placeholder="Keresés (terem kód, név, épület...)";
  input.value=roomQuery;input.autocomplete="off";
  input.oninput=()=>{roomQuery=input.value;renderRoomResults();};
  wrap.appendChild(input);

  const hint=E("div");hint.className="roomsearch-hint";
  hint.textContent="A saját órarended "+ROOMS.length+" terme kereshető itt.";
  wrap.appendChild(hint);

  const list=E("div");list.className="room-list";list.id="roomResultsList";
  wrap.appendChild(list);

  el.appendChild(wrap);
  renderRoomResults();
}
function renderRoomResults(){
  const list=document.getElementById("roomResultsList");if(!list)return;
  list.innerHTML="";
  const q=roomQuery.trim();
  const results=q?ROOMS.filter(r=>matchesRoom(r,q)):ROOMS;
  if(results.length===0){
    const empty=E("div");empty.className="roomsearch-empty";empty.textContent="Nincs találat.";
    list.appendChild(empty);return;
  }
  results.forEach((r,i)=>{
    const colorKey=COLOR_CYCLE[r.id%COLOR_CYCLE.length];
    const isOpen=openRoomMaps.has(r.id);
    const card=E("div");card.className="card room-card "+colorKey;
    card.style.animationDelay=Math.min(i*30,300)+"ms";
    card.innerHTML=
      `<div class="rc-code">${r.code}</div>`+
      `<div class="rc-name">${r.name}</div>`+
      `<div class="rc-meta">${svgLoc}<span>${r.dept} · ${r.address}</span></div>`+
      `<button type="button" class="rc-mapbtn">${isOpen?"Térkép elrejtése":"Térkép mutatása"}</button>`;
    card.querySelector(".rc-mapbtn").onclick=()=>{
      if(isOpen)openRoomMaps.delete(r.id);else openRoomMaps.add(r.id);
      renderRoomResults();
    };
    if(isOpen){
      const mapWrap=E("div");mapWrap.className="room-map";
      const iframe=E("iframe");iframe.loading="lazy";
      iframe.src="https://www.google.com/maps?q="+encodeURIComponent(r.address)+"&output=embed";
      mapWrap.appendChild(iframe);
      card.appendChild(mapWrap);
    }
    list.appendChild(card);
  });
}

function renderChecklistItemsView(){
  const el=document.getElementById("codepage");el.innerHTML="";
  const list=getChecklist(activeChecklistId);
  if(!list){el.textContent="";return;}
  const wrap=E("div");wrap.className="codepage";

  const addRow=E("div");addRow.className="additem";
  const input=E("input");input.type="text";input.className="additem-input";
  input.placeholder=list.category==="shopping"?"Új tétel neve":"Új feladat neve";
  const addBtn=E("button");addBtn.className="additem-btn";addBtn.textContent="Hozzáadás";
  const doAdd=()=>{
    const val=input.value.trim();if(!val)return;
    addItem(list.id,val);input.value="";renderChecklistItemsView();
  };
  addBtn.onclick=doAdd;
  input.onkeydown=e=>{if(e.key==="Enter")doAdd();};
  addRow.appendChild(input);addRow.appendChild(addBtn);
  wrap.appendChild(addRow);

  if(list.items.length===0){
    const empty=E("div");empty.className="checklist-empty";empty.textContent="Még nincs tétel ezen a listán.";
    wrap.appendChild(empty);
  }else if(list.category==="shopping"){
    list.items.forEach(item=>{
      const row=E("div");row.className="shoprow";
      const nm=E("span");nm.className="shopname";nm.textContent=item.name;
      const priceWrap=E("div");priceWrap.className="priceWrap";
      const priceInput=E("input");priceInput.type="number";priceInput.className="priceInput";
      priceInput.value=item.price;priceInput.min="0";
      priceInput.oninput=()=>{
        updateItemPrice(list.id,item.id,Number(priceInput.value)||0);
        sumEl.textContent=calcSum(list).toLocaleString("hu-HU")+" Ft";
      };
      const ftLabel=E("span");ftLabel.className="ftlabel";ftLabel.textContent="Ft";
      const delBtn=E("button");delBtn.className="itemdel";delBtn.innerHTML="✕";delBtn.type="button";
      delBtn.onclick=()=>{removeItem(list.id,item.id);renderChecklistItemsView();};
      priceWrap.appendChild(priceInput);priceWrap.appendChild(ftLabel);
      row.appendChild(nm);row.appendChild(priceWrap);row.appendChild(delBtn);
      wrap.appendChild(row);
    });
    const sumRow=E("div");sumRow.className="sumrow";
    sumRow.innerHTML="<span>Összesen</span>";
    const sumEl=E("span");sumEl.id="checklistSum";sumEl.textContent=calcSum(list).toLocaleString("hu-HU")+" Ft";
    sumRow.appendChild(sumEl);
    wrap.appendChild(sumRow);
  }else{
    list.items.forEach(item=>{
      const row=E("label");row.className="taskrow";
      row.style.setProperty("--task-ac",`var(--${list.colorKey}-ac)`);
      const cb=E("input");cb.type="checkbox";cb.checked=item.done;
      cb.onchange=()=>{toggleItemDone(list.id,item.id);};
      const box=E("span");box.className="taskbox";
      const txt=E("span");txt.className="tasktxt";txt.textContent=item.name;
      const delBtn=E("button");delBtn.className="itemdel";delBtn.innerHTML="✕";delBtn.type="button";
      delBtn.onclick=(e)=>{e.preventDefault();e.stopPropagation();removeItem(list.id,item.id);renderChecklistItemsView();};
      row.appendChild(cb);row.appendChild(box);row.appendChild(txt);row.appendChild(delBtn);
      wrap.appendChild(row);
    });
  }
  el.appendChild(wrap);
}

/* ---------- panels ---------- */
function renderNav(){
  const wrap=document.getElementById("navbody");wrap.innerHTML="";
  NAV_LINKS.forEach(item=>{
    const b=E("button");b.className="navlink"+(view===item.id?" active":"");
    b.textContent=item.label;
    b.onclick=()=>{goto(item.id);closeDrawer();};
    wrap.appendChild(b);
  });
}

function renderChecklistPanel(){
  const wrap=document.getElementById("navbody");wrap.innerHTML="";

  if(!checklistFormOpen){
    const newBtn=E("button");newBtn.className="cl-newbtn";newBtn.textContent="+ Új lista";
    newBtn.onclick=()=>{checklistFormOpen=true;renderChecklistPanel();};
    wrap.appendChild(newBtn);
  }else{
    const form=E("div");form.className="cl-form";
    const pick=E("div");pick.className="cl-catpick";
    Object.entries(CATS).forEach(([key,cat])=>{
      const b=E("button");b.type="button";b.className="cl-cat"+(checklistFormCat===key?" active":"");
      b.textContent=cat.label;
      b.onclick=()=>{checklistFormCat=key;renderChecklistPanel();};
      pick.appendChild(b);
    });
    form.appendChild(pick);
    const nameInput=E("input");nameInput.className="cl-name-input";nameInput.type="text";nameInput.placeholder="Lista neve";
    form.appendChild(nameInput);
    const confirmBtn=E("button");confirmBtn.type="button";confirmBtn.className="cl-confirm";confirmBtn.textContent="Létrehozás";
    confirmBtn.onclick=()=>{
      const val=nameInput.value.trim();if(!val)return;
      createChecklist(checklistFormCat,val);
      checklistFormOpen=false;
      renderChecklistPanel();
    };
    nameInput.onkeydown=e=>{if(e.key==="Enter")confirmBtn.click();};
    form.appendChild(confirmBtn);
    wrap.appendChild(form);
    setTimeout(()=>nameInput.focus(),50);
  }

  checklists.forEach(list=>{
    const row=E("button");row.className="cl-row"+(view==="checklist"&&activeChecklistId===list.id?" active":"");
    const icon=E("span");icon.className="cl-icon";
    icon.style.background=`var(--${list.colorKey}-bg)`;icon.style.color=`var(--${list.colorKey}-tx)`;
    icon.innerHTML=CATS[list.category].icon;
    const name=E("span");name.className="cl-name";name.textContent=list.name;
    const del=E("button");del.className="cl-del";del.innerHTML="✕";del.type="button";
    del.onclick=(e)=>{
      e.stopPropagation();
      if(confirm(`Biztosan törlöd: "${list.name}"?`)){
        deleteChecklist(list.id);
        if(activeChecklistId===list.id)goto("schedule");
        renderChecklistPanel();
      }
    };
    row.appendChild(icon);row.appendChild(name);row.appendChild(del);
    row.onclick=()=>{openChecklist(list.id);closeDrawer();};
    wrap.appendChild(row);
  });
}

function renderSettingsPanel(){
  const wrap=document.getElementById("navbody");wrap.innerHTML="";

  const themeSection=E("div");themeSection.className="set-section";
  const themeLabel=E("div");themeLabel.className="set-label";themeLabel.textContent="Megjelenés";
  const themeRow=E("div");themeRow.className="set-row";
  themeRow.innerHTML="<span>Sötét mód</span>";
  const sw=E("label");sw.className="switch";
  const cb=E("input");cb.type="checkbox";cb.checked=getTheme()==="dark";
  cb.onchange=()=>applyTheme(cb.checked?"dark":"light");
  const track=E("span");track.className="track";
  sw.appendChild(cb);sw.appendChild(track);
  themeRow.appendChild(sw);
  themeSection.appendChild(themeLabel);themeSection.appendChild(themeRow);
  wrap.appendChild(themeSection);

  const exSection=E("div");exSection.className="set-section";
  const exLabel=E("div");exLabel.className="set-label";exLabel.textContent="Órarend exportálása";
  const exRow=E("div");exRow.className="exportbtns";
  const errBox=E("div");errBox.className="export-err";errBox.id="exportErr";errBox.hidden=true;
  const jpgBtn=E("button");jpgBtn.className="exportbtn";jpgBtn.textContent="JPG";
  jpgBtn.onclick=()=>runExport("jpg",jpgBtn,errBox);
  const pdfBtn=E("button");pdfBtn.className="exportbtn";pdfBtn.textContent="PDF";
  pdfBtn.onclick=()=>runExport("pdf",pdfBtn,errBox);
  exRow.appendChild(jpgBtn);exRow.appendChild(pdfBtn);
  exSection.appendChild(exLabel);exSection.appendChild(exRow);exSection.appendChild(errBox);
  wrap.appendChild(exSection);
}

function renderPanel(){
  if(panelMode==="checklist")renderChecklistPanel();
  else if(panelMode==="settings")renderSettingsPanel();
  else renderNav();
}

function syncTriggerStates(){
  const open=document.getElementById("drawer").classList.contains("show");
  document.getElementById("burger").classList.toggle("active",open&&panelMode==="nav");
  document.getElementById("checklistBtn").classList.toggle("active",open&&panelMode==="checklist");
  document.getElementById("gearBtn").classList.toggle("active",open&&panelMode==="settings");
}
function openDrawer(mode){
  panelMode=mode||"nav";
  renderPanel();
  document.getElementById("drawer").classList.add("show");
  document.getElementById("scrim").classList.add("show");
  document.getElementById("drawer").setAttribute("aria-hidden","false");
  syncTriggerStates();
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("scrim").classList.remove("show");
  document.getElementById("drawer").setAttribute("aria-hidden","true");
  checklistFormOpen=false;
  syncTriggerStates();
}
function toggleDrawer(mode){
  const isOpen=document.getElementById("drawer").classList.contains("show");
  if(isOpen&&panelMode===mode)closeDrawer();
  else openDrawer(mode);
}
document.getElementById("burger").onclick=()=>toggleDrawer("nav");
document.getElementById("checklistBtn").onclick=()=>toggleDrawer("checklist");
document.getElementById("gearBtn").onclick=()=>toggleDrawer("settings");
document.getElementById("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();closeCourseSheet();}});

function buildWeekGrid(dataset){
  dataset=dataset||EV;
  const grid=E("div");grid.className="weekgrid";
  DAYS.forEach((d,i)=>{
    const items=dataset.filter(e=>e[0]===i);
    const col=E("div");col.className="wcol"+(i===nowDay?" today":"")+(items.length===0?" freecol":"");
    col.innerHTML=`<div class="wh"><span class="wn">${d}</span><span class="wc">${items.length?items.length+" óra":"szabad"}</span></div>`;
    const cards=E("div");cards.className="wcards";
    if(items.length===0){cards.innerHTML='<div class="wempty">Szabadnap</div>';}
    else items.forEach(e=>{
      const[,s,en,name,room,who,type,pref]=e;
      const isNow=i===nowDay&&nowMin>=mins(s)&&nowMin<mins(en);
      const c=E("div");c.className="wcard "+type+(isNow?" now":"");
      c.innerHTML=`<div class="wt">${s}–${en}</div><div class="wnm">${name}${pref?' ★':''}</div>`+
        `<div class="wr">${svgLoc}<span>${room}</span></div>`;
      cards.appendChild(c);
    });
    col.appendChild(cards);grid.appendChild(col);
  });
  return grid;
}
function week(){
  const w=document.getElementById("week");w.innerHTML="";
  w.appendChild(buildWeekGrid(datasetFor(view)));
}

/* ---------- export ---------- */
const EXPORT_LIGHT_VARS={
  "--bg":"#ffffff","--ink":"#1d2233","--ink-2":"#5a6178","--faint":"#9aa0b4","--hair":"#eef0f4",
  "--ea-bg":"#e8f3f4","--ea-tx":"#1f6b74","--ea-ac":"#2fa8b5",
  "--gy-bg":"#fdeee6","--gy-tx":"#a2542c","--gy-ac":"#e8834b",
  "--pr-bg":"#eeeafb","--pr-tx":"#5a3fa8","--pr-ac":"#8b6de0",
  "--mt-bg":"#e8f1ea","--mt-tx":"#356148","--mt-ac":"#5fa87c",
};
async function exportSchedule(format){
  if(typeof html2canvas!=="function"||!window.jspdf){
    throw new Error("A képexportáláshoz szükséges könyvtár nem töltődött be. Ellenőrizd az internetkapcsolatot, vagy hogy egy hirdetésblokkoló nem tiltja-e a cdnjs.cloudflare.com-ot.");
  }
  const wrap=E("div");wrap.className="export-capture";
  wrap.style.width="1360px";wrap.style.padding="32px";wrap.style.background="#ffffff";
  wrap.style.fontFamily="var(--sans)";
  Object.entries(EXPORT_LIGHT_VARS).forEach(([k,v])=>wrap.style.setProperty(k,v));
  const title=E("div");
  title.style.cssText="font-size:26px;font-weight:800;color:#1d2233;margin-bottom:18px;letter-spacing:-.02em;font-family:'Plus Jakarta Sans',sans-serif";
  title.textContent="Órarend";
  wrap.appendChild(title);
  wrap.appendChild(buildWeekGrid());
  document.body.appendChild(wrap);
  await new Promise(r=>setTimeout(r,50));
  const canvas=await html2canvas(wrap,{backgroundColor:"#ffffff",scale:2});
  document.body.removeChild(wrap);

  if(format==="jpg"){
    const a=E("a");
    a.href=canvas.toDataURL("image/jpeg",0.95);
    a.download="orarend.jpg";
    a.click();
  }else{
    const imgData=canvas.toDataURL("image/jpeg",0.95);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:canvas.width>canvas.height?"landscape":"portrait",unit:"px",format:[canvas.width,canvas.height]});
    pdf.addImage(imgData,"JPEG",0,0,canvas.width,canvas.height);
    pdf.save("orarend.pdf");
  }
}
async function runExport(format,btn,errBox){
  const orig=btn.textContent;
  btn.disabled=true;btn.textContent="...";
  if(errBox){errBox.hidden=true;errBox.textContent="";}
  try{await exportSchedule(format);}
  catch(err){
    console.error(err);
    if(errBox){errBox.textContent=err&&err.message?err.message:"Az exportálás sikertelen.";errBox.hidden=false;}
  }
  finally{btn.disabled=false;btn.textContent=orig;}
}
