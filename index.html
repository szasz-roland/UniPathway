<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Órarend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#1d2233; --ink-2:#5a6178; --faint:#9aa0b4;
    --rail:#20242e; --rail-line:#333949;
    --hair:#eef0f4;
    --ea-bg:#e8f3f4;   --ea-tx:#1f6b74;   --ea-ac:#2fa8b5;
    --gy-bg:#fdeee6;   --gy-tx:#a2542c;   --gy-ac:#e8834b;
    --pr-bg:#eeeafb;   --pr-tx:#5a3fa8;   --pr-ac:#8b6de0;
    --mt-bg:#e8f1ea;   --mt-tx:#356148;   --mt-ac:#5fa87c;
    --sel:#f4b63f;
    --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-in-out:cubic-bezier(.77,0,.175,1);
    --ease-drawer:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  
  /* FIX 1: Strict height matching & no bounce scrolling */
  html, body {
    height: 100dvh; /* Dynamic viewport height (perfect for mobile) */
    height: 100vh;  /* Fallback for older engines */
    margin: 0;
    padding: 0;
    overscroll-behavior: none; /* Prevents the "rubber band" bounce effect */
  }
  
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.4;
    -webkit-font-smoothing:antialiased; display: flex; flex-direction: column;
  }

  /* FIX 2: Constrain shell to exact screen size */
  .shell{display:grid;grid-template-columns:76px 1fr;height:100%;width:100%;overflow:hidden}

  /* ---- left rail ---- */
  .rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:4px;
    position:sticky;top:0;height:100%}
  .rail .logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px;cursor:pointer;flex:0 0 auto;
    transition:background .15s,transform 140ms var(--ease-out)}
  .rail .logo svg{opacity:.9}
  .rail .logo:hover{background:var(--rail-line)}
  .rail .logo:active{transform:scale(.92)}
  .dbtn{width:44px;height:44px;min-height:44px;max-height:44px;flex:0 0 44px;border:none;background:transparent;color:#aeb4c7;font-family:var(--sans);
    font-weight:700;font-size:15px;border-radius:12px;cursor:pointer;position:relative;transition:background .15s,color .15s,transform 140ms var(--ease-out);
    display:grid;place-items:center;line-height:1;padding:0}
  .dbtn:hover{background:var(--rail-line);color:#fff}
  .dbtn:active{transform:scale(.93)}
  .dbtn.on{background:#fff;color:var(--rail)}
  .dbtn.on::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
    width:6px;height:6px;border-radius:50%;background:var(--sel)}
  .dbtn .cnt{position:absolute;top:6px;right:8px;font-size:9px;font-weight:800;color:var(--sel);line-height:1}
  .dbtn.on .cnt{color:var(--gy-ac)}
  .dbtn.free{opacity:.45}
  #rail{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;flex:0 0 auto;height:auto}
  #rail .dbtn{height:44px;flex:0 0 44px;align-self:center}
  .rail .gear{margin-top:auto;width:40px;height:40px;border:none;background:transparent;color:#8a90a6;
    cursor:pointer;border-radius:11px;display:grid;place-items:center;transition:background .15s,color .15s,transform 140ms var(--ease-out)}
  .rail .gear:hover{background:var(--rail-line);color:#fff}
  .rail .gear:active{transform:scale(.9)}

  /* FIX 3: Make main area scroll independently, reduce padding to maximize space */
  .main{padding:28px clamp(16px,4vw,40px) 40px;min-width:0;overflow-y:auto;height:100%}
  
  .head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
  .head .title{font-size:32px;font-weight:800;letter-spacing:-.02em}
  .head .title .day{display:block;font-size:15px;font-weight:600;color:var(--ink-2);margin-top:2px}
  .head .date{text-align:right}
  .head .date .d{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.01em}
  .head .date .m{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:3px}

  .list{display:flex;flex-direction:column;gap:14px;max-width:640px}
  .item{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;animation:enterUp 260ms var(--ease-out) both}
  .item:nth-child(2){animation-delay:40ms}
  .item:nth-child(3){animation-delay:80ms}
  .item:nth-child(4){animation-delay:120ms}
  .item:nth-child(5){animation-delay:160ms}
  @keyframes enterUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .item .tcol{text-align:right;padding-top:14px}
  .item .tcol .s{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
  .item .tcol .e{font-size:12px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:2px}
  .card{border-radius:18px;padding:16px 18px;position:relative;cursor:default;overflow:hidden;
    border:1px solid transparent}
  .card .arw{position:absolute;top:15px;right:16px;opacity:.5}
  .card .cn{font-size:17px;font-weight:700;letter-spacing:-.01em;padding-right:22px;line-height:1.2}
  .card .sub{font-size:13px;font-weight:600;opacity:.85;margin-top:3px}
  .card .foot{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;font-weight:600;opacity:.9}
  .card .foot svg{opacity:.7}
  .card.ea{background:var(--ea-bg);color:var(--ea-tx)}  .card.ea .arw{color:var(--ea-ac)}
  .card.gy{background:var(--gy-bg);color:var(--gy-tx)}  .card.gy .arw{color:var(--gy-ac)}
  .card.pr{background:var(--pr-bg);color:var(--pr-tx)}  .card.pr .arw{color:var(--pr-ac)}
  .card.mt{background:var(--mt-bg);color:var(--mt-tx)}  .card.mt .arw{color:var(--mt-ac)}
  .card.now{box-shadow:0 8px 24px -8px currentColor;animation:nowPulse 3200ms var(--ease-in-out) infinite}
  @keyframes nowPulse{0%,100%{box-shadow:0 8px 24px -8px currentColor}50%{box-shadow:0 12px 30px -6px currentColor}}
  .card .pin{font-weight:800}

  .freeday{max-width:560px;text-align:center;padding:60px 20px;color:var(--faint);animation:enterUp 260ms var(--ease-out) both}
  .freeday .big{font-size:26px;font-weight:800;color:var(--mt-tx)}
  .freeday .s{font-size:14px;margin-top:8px}

  .drchips{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
  .drchip{background:#f5f6f9;border-radius:11px;padding:10px 13px}
  .drchip b{display:block;font-weight:700;font-size:13px}
  .drchip span{color:var(--faint);font-size:11.5px}

  /* ---- code drawer ---- */
  .scrim{position:fixed;inset:0;background:rgba(20,24,36,.4);opacity:0;visibility:hidden;transition:opacity 250ms var(--ease-out),visibility 250ms;z-index:60}
  .scrim.show{opacity:1;visibility:visible}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:min(390px,88vw);background:#fff;z-index:70;
    transform:translateX(-100%);transition:transform 320ms var(--ease-drawer);display:flex;flex-direction:column;
    box-shadow:2px 0 30px rgba(20,24,36,.18)}
  .drawer.show{transform:translateX(0)}
  .dr-top{padding:24px 22px 16px;border-bottom:1px solid var(--hair)}
  .dr-top h2{font-size:22px;font-weight:800}
  .dr-top p{font-size:12.5px;color:var(--ink-2);margin-top:3px}
  .dr-close{position:absolute;top:20px;right:18px;width:34px;height:34px;border:none;background:#f2f3f7;
    border-radius:10px;cursor:pointer;font-size:18px;color:var(--ink-2);transition:transform 140ms var(--ease-out)}
  .dr-close:active{transform:scale(.9)}
  .dr-body{overflow-y:auto;padding:14px 16px;flex:1}
  .grp{font-size:11px;font-weight:700;color:var(--faint);margin:14px 4px 8px}
  .grp:first-child{margin-top:2px}
  .crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--hair);
    background:#fafbfc;border-radius:11px;padding:11px 13px;margin-bottom:6px;cursor:pointer;
    font-family:var(--sans);color:var(--ink);transition:border-color 150ms ease,background-color 150ms ease,transform 140ms var(--ease-out)}
  .crow:hover{border-color:var(--ea-ac)}
  .crow:active{transform:scale(.98)}
  .crow.copied{border-color:var(--mt-ac);background:var(--mt-bg)}
  .crow .ck{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;min-width:128px;color:var(--ea-tx)}
  .crow.copied .ck{color:var(--mt-tx)}
  .crow .cnm{font-size:12px;color:var(--ink-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .cic{font-size:12px;color:var(--faint)}
  .dr-foot{padding:14px 16px 20px;border-top:1px solid var(--hair)}
  .copyall{width:100%;background:var(--ink);color:#fff;border:none;border-radius:12px;padding:14px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:background 150ms ease,transform 140ms var(--ease-out)}
  .copyall:active{background:var(--ea-tx);transform:scale(.98)}

  /* ---- week grid (wide desktop) ---- */
  .week{display:none}
  .weekgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:4px}
  .wcol{min-width:0;animation:enterUp 300ms var(--ease-out) both}
  .wcol:nth-child(2){animation-delay:40ms}
  .wcol:nth-child(3){animation-delay:80ms}
  .wcol:nth-child(4){animation-delay:120ms}
  .wcol:nth-child(5){animation-delay:160ms}
  .wcol .wh{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 12px;
    border-bottom:2px solid var(--hair);margin-bottom:12px}
  .wcol .wh .wn{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .wcol.today .wh .wn{color:var(--gy-ac)}
  .wcol.freecol .wh .wn{color:var(--faint)}
  .wcol .wh .wc{font-size:11px;font-weight:700;color:var(--faint)}
  .wcol .wcards{display:flex;flex-direction:column;gap:10px}
  .wcard{border-radius:14px;padding:11px 12px;position:relative;overflow:hidden}
  .wcard .wt{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;opacity:.85}
  .wcard .wnm{font-size:13.5px;font-weight:700;line-height:1.2;margin:3px 0 4px;letter-spacing:-.01em}
  .wcard .wr{font-size:11px;font-weight:600;opacity:.82;display:flex;gap:4px;align-items:flex-start}
  .wcard .wr svg{flex:0 0 auto;margin-top:1px;opacity:.7}
  .wcard.ea{background:var(--ea-bg);color:var(--ea-tx)}
  .wcard.gy{background:var(--gy-bg);color:var(--gy-tx)}
  .wcard.pr{background:var(--pr-bg);color:var(--pr-tx)}
  .wcard.mt{background:var(--mt-bg);color:var(--mt-tx)}
  .wcard.now{box-shadow:0 6px 18px -6px currentColor;animation:nowPulseSm 3200ms var(--ease-in-out) infinite}
  @keyframes nowPulseSm{0%,100%{box-shadow:0 6px 18px -6px currentColor}50%{box-shadow:0 9px 22px -5px currentColor}}
  .wempty{padding:26px 8px;text-align:center;color:var(--faint);font-size:12.5px;font-weight:600;
    border:1.5px dashed var(--hair);border-radius:14px}

  /* =========== BREAKPOINTS =========== */
  @media(min-width:1080px){
    .main{padding:38px clamp(28px,4vw,64px) 72px;max-width:1500px}
    .list,.freeday{display:none}
    .week{display:block}
    .head .date{display:none}
    .head .title .day{display:none}
  }
  @media(min-width:641px) and (max-width:1079px){
    .list,.freeday{max-width:none}
    .main{max-width:820px}
  }
  
  /* FIX 4: Mobile optimizations for Galaxy A55 and similar devices */
  @media(max-width:640px){
    .shell{grid-template-columns:56px 1fr}
    .rail{padding:16px 0}
    #rail .dbtn,.dbtn{width:38px;height:38px;min-height:38px;max-height:38px;flex-basis:38px;font-size:13px}
    .rail .logo{width:32px;height:32px}
    .rail .gear{width:36px;height:36px}
    
    /* Tighter padding and independent scrolling for mobile */
    .main{padding:20px 14px 32px; overflow-y: auto; height: 100%;}
    .head{margin-bottom:16px}
    .head .title{font-size:26px}
    .head .title .day{font-size:13px}
    .head .date .d{font-size:24px}
    .head .date .m{font-size:11px}
    
    .list{gap:12px} /* Slightly tighter gap to fit more on screen */
    .item{grid-template-columns:42px 1fr;gap:9px}
    .item .tcol{padding-top:12px}
    .item .tcol .s{font-size:13px}
    .item .tcol .e{font-size:11px}
    .card{padding:13px 14px;border-radius:15px}
    .card .cn{font-size:15px;padding-right:20px}
    .card .foot{font-size:11px;margin-top:9px}
    .drawer{width:min(360px,92vw)}
  }
  
  @media(max-width:380px){
    .head .title{font-size:23px}
    .card .cn{font-size:14.5px}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition:none!important}
    .item,.freeday,.wcol,.card.now,.wcard.now{animation:none!important}
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="logo" id="burger" title="Kurzuskódok">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </div>
      <div id="rail"></div>
      <button class="gear" title="Kódok" onclick="openDrawer()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </aside>

    <main class="main">
      <div class="head">
        <div class="title">Órarend<span class="day" id="dayName">Hétfő</span></div>
        <div class="date"><div class="d" id="dCount">4</div><div class="m">óra ma</div></div>
      </div>
      <div id="list"></div>
      <div class="week" id="week"></div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <nav class="drawer" id="drawer" aria-hidden="true">
    <div class="dr-top">
      <button class="dr-close" onclick="closeDrawer()" aria-label="Bezárás">×</button>
      <h2>Tárgyak és kódok</h2><p>Online tárgyak és a felvételi kódok.</p>
    </div>
    <div class="dr-body" id="drbody"></div>
    <div class="dr-foot"><button class="copyall" id="copyall">Összes kód másolása</button></div>
  </nav>

<script>
const DAYS=["Hétfő","Kedd","Szerda","Csütörtök","Péntek"];
const SHORT=["H","K","Sz","Cs","P"];
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const EV=[
 [0,"10:00","11:00","Számítógép hálózatok","TIK Alagsor I–II. Előadó","Bilicki Vilmos","ea"],
 [0,"12:00","14:00","Matematika praktikum","Bolyai János terem","Csuma-Kovács, Szalai","gy"],
 [0,"14:00","16:00","Programozás alapjai gy.","Irinyi 224 PC-terem","Gercső Márk, Báló, Gergely","gy",true],
 [0,"16:00","18:00","Személyes és szociális készségek","TIK Kongresszusi terem","Holló Csaba","ea"],
 [1,"08:00","10:00","Programozás alapjai ea.","TIK Kongresszusi terem","Gergely Tamás","ea"],
 [1,"12:00","14:00","Matematika 1. ea.","TIK Kongresszusi terem","Dormán Miklós","ea"],
 [1,"17:00","19:00","Matematika 1. gy.","Haar Alfréd terem","Galántai-Fekete, Dormán","mt"],
 [3,"15:00","16:00","Programozás alapjai praktikum","Irinyi 217 PC-terem","Kleisz, Oczkó, Gergely","pr"],
 [3,"16:00","18:00","Egyetemi informatikai alapok","Irinyi 213 PC-terem","Devosa Iván","gy"],
];
const ONLINE=[
 ["Webfejlesztés alapjai (ea)","Coursera · Holló Csaba"],
 ["Webfejlesztés alapjai gy.","Coursera · Holló Csaba"],
 ["IT-biztonság az SZTE-n","E-learning · kritérium"],
 ["MI az egyetemi tanulmányokban","E-learning · kritérium"],
 ["Karrierépítés alapozó kurzus","kritérium · 0 kredit"],
];
const CODES=[
 ["Kötelező tárgyak",[
   ["IN1001EA","Programozás alapjai (ea)"],["IN1001LA-16","Programozás alapjai gy."],
   ["IN1001SA-11","Programozás alapjai praktikum"],["MN1841EA-1","Matematika 1. ea."],
   ["MN1841GA-14","Matematika 1. gy."],["MN1840GA-9","Matematika praktikum"],
   ["IN1013EA","Számítógép hálózatok"],["IN1004LA","Egyetemi informatikai alapok"],
   ["IN1005EA","Személyes és szociális készségek"],["IN1014EA-Coursera","Webfejlesztés (ea)"],
   ["IN1014LA-Coursera","Webfejlesztés gy."],
 ]],
 ["Kritérium (0 kredit)",[
   ["XK001-ITSEC_SZTE-HU","IT-biztonság az SZTE-n"],["XK001-MINI_SZTE-HU","MI az egyetemi tanulmányokban"],
   ["XA0031-ALK2","Karrierépítés alapozó kurzus"],
 ]],
];
const E=document.createElement.bind(document);
const svgArw='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
const svgLoc='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>';
const now=new Date();const nowDay=now.getDay()-1;const nowMin=now.getHours()*60+now.getMinutes();
let curDay=(nowDay<0||nowDay>4)?0:nowDay;

function rail(){
  const r=document.getElementById("rail");r.innerHTML="";
  DAYS.forEach((d,i)=>{
    const n=EV.filter(e=>e[0]===i).length;
    const b=E("button");b.className="dbtn"+(i===curDay?" on":"")+(n===0?" free":"");
    b.innerHTML=SHORT[i]+(n?`<span class="cnt">${n}</span>`:"");
    b.onclick=()=>{curDay=i;rail();day()};
    r.appendChild(b);
  });
}
function day(){
  document.getElementById("dayName").textContent=DAYS[curDay];
  const items=EV.filter(e=>e[0]===curDay);
  document.getElementById("dCount").textContent=items.length||"0";
  const wrap=document.getElementById("list");wrap.innerHTML="";
  if(items.length===0){
    const f=E("div");f.className="freeday";f.innerHTML='<div class="big">Szabadnap</div><div class="s">Nincs egyetlen órád sem. Élvezd.</div>';
    wrap.appendChild(f);return;
  }
  const list=E("div");list.className="list";
  items.forEach(e=>{
    const[,s,en,name,room,who,type,pref]=e;
    const isNow=curDay===nowDay&&nowMin>=mins(s)&&nowMin<mins(en);
    const it=E("div");it.className="item";
    it.innerHTML=
      `<div class="tcol"><div class="s">${s}</div><div class="e">${en}</div></div>`+
      `<div class="card ${type}${isNow?' now':''}">`+
        `<span class="arw">${svgArw}</span>`+
        `<div class="cn">${name}${pref?' <span class="pin">★</span>':''}</div>`+
        `<div class="foot">${svgLoc}<span>${room} · ${who}</span></div>`+
      `</div>`;
    list.appendChild(it);
  });
  wrap.appendChild(list);
}
function drawer(){
  const b=document.getElementById("drbody");b.innerHTML="";
  const og=E("div");og.className="grp";og.textContent="Rögzített időpont nélkül";b.appendChild(og);
  const oc=E("div");oc.className="drchips";
  ONLINE.forEach(([n,m])=>{const x=E("div");x.className="drchip";x.innerHTML=`<b>${n}</b><span>${m}</span>`;oc.appendChild(x);});
  b.appendChild(oc);
  CODES.forEach(([grp,rows])=>{
    const g=E("div");g.className="grp";g.textContent=grp;b.appendChild(g);
    rows.forEach(([k,n])=>{
      const r=E("button");r.className="crow";
      r.innerHTML=`<span class="ck">${k}</span><span class="cnm">${n}</span><span class="cic">⧉</span>`;
      r.onclick=()=>navigator.clipboard.writeText(k).then(()=>{
        r.classList.add("copied");r.querySelector(".cic").textContent="✓";
        setTimeout(()=>{r.classList.remove("copied");r.querySelector(".cic").textContent="⧉"},1200);
      });
      b.appendChild(r);
    });
  });
}
function openDrawer(){document.getElementById("drawer").classList.add("show");document.getElementById("scrim").classList.add("show");document.getElementById("drawer").setAttribute("aria-hidden","false")}
function closeDrawer(){document.getElementById("drawer").classList.remove("show");document.getElementById("scrim").classList.remove("show");document.getElementById("drawer").setAttribute("aria-hidden","true")}
document.getElementById("burger").onclick=openDrawer;
document.getElementById("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
document.getElementById("copyall").onclick=()=>{
  const all=CODES.flatMap(g=>g[1].map(r=>r[0])).join("\n");
  navigator.clipboard.writeText(all).then(()=>{
    const btn=document.getElementById("copyall");const o=btn.textContent;
    btn.textContent="✓ Mind a "+CODES.flatMap(g=>g[1]).length+" kód másolva";setTimeout(()=>btn.textContent=o,1500);
  });
};
function week(){
  const w=document.getElementById("week");w.innerHTML="";
  const grid=E("div");grid.className="weekgrid";
  DAYS.forEach((d,i)=>{
    const items=EV.filter(e=>e[0]===i);
    const col=E("div");col.className="wcol"+(i===nowDay?" today":"")+(items.length===0?" freecol":"");
    col.innerHTML=`<div class="wh"><span class="wn">${d}</span><span class="wc">${items.length?items.length+" óra":"szabad"}</span></div>`;
    const cards=E("div");cards.className="wcards";
    if(items.length===0){cards.innerHTML='<div class="wempty">Szabadnap</div>';}
    else items.forEach(e=>{
      const[,s,en,name,room,who,type,pref]=e;
      const isNow=i===nowDay&&nowMin>=mins(s)&&nowMin<mins(en);
      const c=E("div");c.className="wcard "+type+(isNow?" now":"");
      c.innerHTML=`<div class="wt">${s}–${en}</div><div class="wnm">${name}${pref?' ★':''}</div>`+
        `<div class="wr">${svgLoc}<span>${room}</span></div>`;
      cards.appendChild(c);
    });
    col.appendChild(cards);grid.appendChild(col);
  });
  w.appendChild(grid);
}
rail();day();week();drawer();
</script>
