<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<script>
(function(){
  try{
    /* js/sync.js (loaded later, after this must-run-synchronously-before-first-paint script)
       wraps saved values as {value,updatedAt} so cross-device sync can compare ages — see its own
       comment. A bare "dark"/"light" string isn't valid JSON on its own, so JSON.parse throws for
       that legacy/no-sync shape and the catch below falls back to using it as-is; either shape
       resolves to the right mode with no added round-trip, so the flash-of-wrong-theme prevention
       this script exists for is unaffected. */
    var raw=localStorage.getItem("orarend-theme");
    var saved=null;
    if(raw){
      try{ var parsed=JSON.parse(raw); saved=(parsed&&typeof parsed==="object"&&"value" in parsed)?parsed.value:raw; }
      catch(e){ saved=raw; }
    }
    var mode=saved||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    document.documentElement.setAttribute("data-theme",mode);
  }catch(e){}
})();
</script>
<!-- Module registry: must exist before any module's own <script> loads (modules load before
     js/script.js — see CLAUDE.md's module convention), so this stays a tiny synchronous inline
     script here rather than living inside js/script.js itself. -->
<script>
  window.MODULES=[];
  window.registerModule=function(m){window.MODULES.push(m);};
</script>
<title>Órarend</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Órarend">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- Modules: each stays self-contained under modules/<name>/ (never copied/flattened into
     css/, js/, schedule_data/), styled after tanterv-module's own layout — see CLAUDE.md. -->
<link rel="stylesheet" href="modules/tanterv-module/css/tanterv.css">
</head>
<body>
  <!-- Login gate: the real barrier is Supabase RLS on the data itself (see CLAUDE.md's "Account
       sync" note and supabase/schema.sql) — this screen is what makes that visible/usable rather
       than the app silently loading with empty data. Sample/functional only for now, styling to
       come later. .shell starts hidden; js/script.js's boot sequence shows exactly one of the two,
       once Sync.ready resolves the real auth state, with no flash of the wrong one. -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-accent">
        <span class="login-dot d1" aria-hidden="true"></span>
        <span class="login-dot d2" aria-hidden="true"></span>
        <span class="login-dot d3" aria-hidden="true"></span>
        <span class="login-dot d4" aria-hidden="true"></span>
        <div class="login-logo"><img src="assets/icon.png" alt="" width="48" height="48"></div>
        <div class="login-accent-title">Órarend</div>
        <div class="login-accent-sub">A saját órarended, egy helyen — jelentkezz be a folytatáshoz.</div>
      </div>
      <div class="login-form-panel">
        <div class="login-heading">Bejelentkezés</div>
        <div class="login-subtext">Add meg a fiókod adatait.</div>
        <div class="login-fields">
          <input type="email" id="loginEmail" class="login-input" placeholder="E-mail cím" autocomplete="username">
          <input type="password" id="loginPassword" class="login-input" placeholder="Jelszó" autocomplete="current-password">
        </div>
        <button type="button" id="loginSubmit" class="login-submit">Bejelentkezés</button>
        <div id="loginError" class="export-err" hidden></div>
      </div>
    </div>
  </div>

  <div class="shell" hidden>
    <aside class="rail">
      <div class="logo" id="burger" title="Menü">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </div>
      <div id="rail"></div>
      <div class="navicons" id="navIcons"></div>
      <button class="checklist-btn" id="checklistBtn" title="Listák">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
      </button>
      <button class="gear" id="gearBtn" title="Beállítások">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </aside>

    <main class="main">
      <div class="head">
        <div class="title" id="pageTitle">Órarend<span class="day" id="dayName">Hétfő</span></div>
        <div class="date" id="dateBox"><div class="d" id="dCount">4</div><div class="m">óra ma</div></div>
      </div>
      <div id="schedviews">
        <div id="list"></div>
        <div class="week" id="week"></div>
      </div>
      <div id="codepage" hidden></div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <nav class="drawer" id="drawer" aria-hidden="true">
    <div class="dr-body" id="navbody"></div>
  </nav>

  <div class="sheet-scrim" id="sheetScrim"></div>
  <div class="sheet" id="courseSheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <button type="button" class="sheet-close" id="sheetClose" aria-label="Bezárás">&times;</button>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

<!-- Account sync: pinned exact version, like html2canvas/jspdf above — see CLAUDE.md. Not deferred,
     and loaded before js/sync.js, since sync.js calls supabase.createClient() at load time. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/sync.js"></script>

<!-- Modules: script + registration, always before js/script.js — see CLAUDE.md's module convention. -->
<script src="modules/tanterv-module/js/tanterv.js"></script>
<script>
  registerModule({
    id:"tanterv",
    label:"Tanterv",
    icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>',
    mount:function(el){
      return Tanterv.mount(el,{
        storage:Sync.store("orarend-tanterv-v1"),
        dataUrl:"modules/tanterv-module/curriculum_data/umi_bprof.json"
      });
    }
  });
</script>

<script src="js/script.js"></script>
</body>
</html>
